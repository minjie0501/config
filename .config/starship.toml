"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$aws\
$nodejs\
$python\
$rust\
$golang\
$php\
\n$character"""

[directory]
style = "bold #769ff0"
format = "[$path]($style) "
truncation_length = 0

[git_branch]
symbol = ""
style = "#a3aed2"
format = '[$symbol $branch]($style) '

[git_status]
style = "#e0af68"
format = '[($all_status$ahead_behind )]($style)'

[aws]
symbol = "☁️"
style = "#ff9e64"
format = '[$symbol $profile( \($region\))]($style) '

[nodejs]
symbol = ""
style = "#73daca"
format = '[$symbol( $version)]($style) '

[rust]
symbol = ""
style = "#73daca"
format = '[$symbol( $version)]($style) '

[golang]
symbol = ""
style = "#73daca"
format = '[$symbol( $version)]($style) '

[php]
symbol = ""
style = "#73daca"
format = '[$symbol( $version)]($style) '

[python]
symbol = "🐍"
style = "#73daca"
format = '[$symbol( $version)]($style) '
pyenv_version_name = false

[time]
disabled = true
