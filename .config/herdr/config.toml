onboarding = false

[theme.custom]
accent = "#c6a0f6"
panel_bg = "#24273a"
green = "#a6da95"
yellow = "#eed49f"
red = "#ed8796"
blue = "#8aadf4"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
agent_panel_sort = "priority"
accent = "#c6a0f6"

[keys]
# Prefix: C-;
prefix = "ctrl+semicolon"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "Navigate left (Vim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "Navigate down (Vim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "Navigate up (Vim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "Navigate right (Vim/Herdr)"

[advanced]
scrollback_limit_bytes = 52428800

[experimental]
pane_history = true

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
]


[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"]
]
